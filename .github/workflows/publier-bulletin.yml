name: Publier le bulletin depuis Drive

on:
  schedule:
    # Trois passages chaque matin : si l'un est manque ou retarde par GitHub,
    # les suivants prennent le relais. Le flux ne fait un commit que si le
    # contenu a change, donc les passages supplementaires ne coutent rien.
    # Heures UTC -> Toronto : 9 h 40 = 5 h 40 (ete) / 4 h 40 (hiver) ;
    # 10 h 40 = 6 h 40 (ete) / 5 h 40 (hiver) ; 11 h 40 = 7 h 40 (ete) / 6 h 40 (hiver).
    # En hiver, le depot de 5 h 00 (10 h 00 UTC) a lieu apres le premier passage :
    # c'est le passage de 10 h 40 UTC qui publie l'edition du jour.
    - cron: '40 9 * * *'
    - cron: '40 10 * * *'
    - cron: '40 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Telecharger les fichiers depuis Google Drive
        run: |
          curl -L -f -o index.html "https://drive.google.com/uc?export=download&id=1vGRN92QbQPZpfS6w0g07i6GiHIqenN0e"
          curl -L -f -o circulaires.html "https://drive.google.com/uc?export=download&id=1aS3qz-aUPEgDXo9Zy8if5O1D04f0SXuA"
          curl -L -f -o "bulletin-$(date +%Y-%m-%d).mp3" "https://drive.google.com/uc?export=download&id=1q6axvjeIyJ5vYhbLe9PZU_EfR_iWrQ8v"
          ls -la index.html circulaires.html "bulletin-$(date +%Y-%m-%d).mp3"
      - name: Publier sur GitHub Pages
        run: |
          git config user.name "Muse bulletin"
          git config user.email "muse-bulletin@example.com"
          git add index.html circulaires.html "bulletin-$(date +%Y-%m-%d).mp3"
          git diff --cached --quiet || (git commit -m "Bulletin du $(date +%Y-%m-%d)" && git push)
